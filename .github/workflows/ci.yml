name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip==26.2
          python -m pip install --requirement requirements-dev.txt

      - name: Run Ruff
        run: |
          ruff check \
            --output-format=github \
            src \
            scripts \
            tests

      - name: Compile Python sources
        run: |
          python -m compileall \
            -q \
            src \
            scripts \
            tests

  unit-tests:
    name: Portable unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2
          python -m pip install --requirement requirements.txt

      - name: Run portable test suite
        run: pytest -q

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: semanticcart
          POSTGRES_USER: semanticcart
          POSTGRES_PASSWORD: semanticcart
        ports:
          - 5432:5432
        options: >-
          --health-cmd
          "pg_isready -U semanticcart -d semanticcart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2
          python -m pip install --requirement requirements.txt

      - name: Apply PostgreSQL migrations
        run: |
          docker exec -i \
            "${{ job.services.postgres.id }}" \
            psql \
            -v ON_ERROR_STOP=1 \
            -U semanticcart \
            -d semanticcart \
            < docker/postgres/init/001_schema.sql

          docker exec -i \
            "${{ job.services.postgres.id }}" \
            psql \
            -v ON_ERROR_STOP=1 \
            -U semanticcart \
            -d semanticcart \
            < docker/postgres/init/002_catalog_embeddings.sql

      - name: Verify pgvector extension
        run: |
          test "$(
            docker exec \
              "${{ job.services.postgres.id }}" \
              psql \
              -At \
              -U semanticcart \
              -d semanticcart \
              -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';"
          )" = "0.8.6"

      - name: Run PostgreSQL integration tests
        env:
          SEMANTICCART_TEST_DATABASE_URL: postgresql://semanticcart:semanticcart@127.0.0.1:5432/semanticcart
        run: |
          pytest \
            tests/test_postgres_events.py \
            -q

  docker-image:
    name: API image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build serving image
        run: |
          docker build \
            --tag semanticcart-api:ci \
            .

      - name: Verify runtime import
        run: |
          docker run \
            --rm \
            semanticcart-api:ci \
            python \
            -c "from semanticcart.api import app; assert app.title == 'SemanticCart API'"

      - name: Verify non-root runtime
        run: |
          test "$(
            docker run \
              --rm \
              --entrypoint id \
              semanticcart-api:ci \
              -u
          )" = "10001"